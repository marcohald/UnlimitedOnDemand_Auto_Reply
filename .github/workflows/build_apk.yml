name: Build APK and Release

on:
  push:
    branches:
      - '**' # Trigger on all branches to allow artifact builds
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Versioning
        id: versioning
        run: |
          # Determine if this is a tag release, a pre-release on master, or a feature branch build
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            IS_RELEASE="true"
            VERSION_NAME="${GITHUB_REF#refs/tags/}"
            TAG_NAME="$VERSION_NAME"
          else
            IS_RELEASE="false"
            BASE_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            VERSION_NAME="${BASE_VERSION}-build.${{ github.run_number }}"
            TAG_NAME="pre-${{ github.run_number }}"
          fi
          
          # Inject version into build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build APK based on branch
        run: |
          chmod +x gradlew
          if [ "${{ github.ref }}" == "refs/heads/master" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Sign APK (Master and Tags Only)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}

      - name: Rename Release APK
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: |
          mv ${{steps.sign_app.outputs.signedReleaseFile}} app-release-${{ steps.versioning.outputs.version_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            app-release-${{ steps.versioning.outputs.version_name }}.apk
            app/build/outputs/apk/**/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk

      - name: Create Release (Master and Tags Only)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Release ${{ steps.versioning.outputs.version_name }}
          prerelease: ${{ steps.versioning.outputs.is_release == 'false' }}
          generate_release_notes: true
          files: app-release-${{ steps.versioning.outputs.version_name }}.apk
